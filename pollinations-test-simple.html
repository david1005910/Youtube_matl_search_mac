<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pollinations 간단 테스트</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            background: #6b46c1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover {
            background: #553592;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
            display: block;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <h1>🎨 Pollinations API 간단 테스트</h1>
    
    <div class="status" id="status">준비됨</div>
    
    <button onclick="testDirect()">1. 직접 URL 테스트</button>
    <button onclick="testWithLoad()">2. 이미지 로드 테스트</button>
    <button onclick="testWithTimeout()">3. 타임아웃 테스트</button>
    
    <div id="result"></div>

    <script>
        function updateStatus(msg, isError = false) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = isError ? 'status error' : 'status success';
            console.log(msg);
        }

        // 1. 직접 URL로 이미지 표시
        function testDirect() {
            updateStatus('직접 URL 테스트 시작...');
            
            const prompt = 'A beautiful sunset over mountains, photorealistic, high quality';
            const seed = Math.floor(Math.random() * 1000000);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1280&height=720&seed=${seed}&nologo=true&model=turbo`;
            
            const result = document.getElementById('result');
            result.innerHTML = `
                <h3>직접 URL 테스트</h3>
                <p>URL: ${url}</p>
                <img src="${url}" alt="Test image" onload="updateStatus('✅ 이미지 로드 성공!')" onerror="updateStatus('❌ 이미지 로드 실패', true)">
                <br>
                <a href="${url}" target="_blank" style="color: #74c0fc;">새 탭에서 열기</a>
            `;
        }

        // 2. Image 객체로 미리 로드
        async function testWithLoad() {
            updateStatus('이미지 로드 테스트 시작...');
            
            const prompt = 'A cute robot painting a picture, digital art style';
            const seed = Math.floor(Math.random() * 1000000);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1280&height=720&seed=${seed}&nologo=true&model=flux`;
            
            const img = new Image();
            
            try {
                await new Promise((resolve, reject) => {
                    img.onload = () => {
                        updateStatus('✅ 이미지 프리로드 성공!');
                        resolve();
                    };
                    img.onerror = () => {
                        updateStatus('❌ 이미지 프리로드 실패', true);
                        reject(new Error('Load failed'));
                    };
                    img.src = url;
                });
                
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>Image 로드 테스트</h3>
                    <p>URL: ${url}</p>
                    <img src="${url}" alt="Test image">
                `;
                
            } catch (error) {
                console.error('Load test failed:', error);
                
                // 실패해도 URL은 표시해봄
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>로드 실패했지만 URL 시도</h3>
                    <p>URL: ${url}</p>
                    <img src="${url}" alt="Test image">
                    <p style="color: #ffa94d;">이미지가 표시되면 CORS 문제일 수 있습니다.</p>
                `;
            }
        }

        // 3. 타임아웃 포함 테스트
        async function testWithTimeout() {
            updateStatus('타임아웃 테스트 시작 (10초)...');
            
            const prompt = 'A futuristic city at night, cyberpunk style, neon lights';
            const seed = Math.floor(Math.random() * 1000000);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1920&height=1080&seed=${seed}&nologo=true&model=flux-realism`;
            
            const img = new Image();
            
            try {
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        updateStatus('⏱️ 타임아웃 (10초 경과)', true);
                        reject(new Error('Timeout'));
                    }, 10000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        updateStatus('✅ 타임아웃 내 로드 성공!');
                        resolve();
                    };
                    
                    img.onerror = () => {
                        clearTimeout(timeout);
                        updateStatus('❌ 이미지 로드 에러', true);
                        reject(new Error('Load error'));
                    };
                    
                    img.src = url;
                });
                
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>타임아웃 테스트 성공</h3>
                    <p>URL: ${url}</p>
                    <img src="${url}" alt="Test image">
                `;
                
            } catch (error) {
                console.error('Timeout test failed:', error);
                
                const result = document.getElementById('result');
                result.innerHTML = `
                    <h3>타임아웃/에러 발생</h3>
                    <p>에러: ${error.message}</p>
                    <p>URL을 직접 시도합니다:</p>
                    <img src="${url}" alt="Test image">
                    <br>
                    <a href="${url}" target="_blank" style="color: #74c0fc;">브라우저에서 직접 열기</a>
                `;
            }
        }
        
        // 페이지 로드 시 자동 테스트
        window.addEventListener('load', () => {
            updateStatus('Pollinations API 테스트 준비 완료');
        });
    </script>
</body>
</html>
